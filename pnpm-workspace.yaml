packages:
    - packages/**
    - docs-bis
allowBuilds:
    esbuild: true
catalog:
    '@arethetypeswrong/core': ^0.18.5
    '@noeldemartin/faker': 7.6.0
    '@noeldemartin/scripts': next
    '@noeldemartin/solid-utils': next
    '@noeldemartin/testing': next
    '@noeldemartin/utils': next
    '@noeldemartin/vite-plus-config': next
    '@rdfjs/types': ^2.0.1
    fake-indexeddb: ^6.0.1
    publint: ^0.3.24
    # Must match the exact version bundled by vite-plus.
    vitest: 5.1.0
    vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
    vite-plus: 1.7.0
overrides:
    vite@*: 'catalog:'
    # VitePress 1 (root docs) doesn't support Rolldown, so it keeps its own Vite 5.
    'vitepress@1>vite': ^5.4.14
    vitest@*: 'catalog:'
peerDependencyRules:
    allowAny:
        - vitest
    allowedVersions:
        vitest: '*'
minimumReleaseAgeExclude:
    - '@noeldemartin/*'
