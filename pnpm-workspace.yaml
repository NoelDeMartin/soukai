packages:
    - packages/**
allowBuilds:
    esbuild: true
catalog:
    '@arethetypeswrong/core': ^0.18.5
    '@noeldemartin/faker': 7.6.0
    '@noeldemartin/scripts': next
    '@noeldemartin/solid-utils': next
    '@noeldemartin/testing': next
    '@noeldemartin/utils': next
    '@rdfjs/types': ^2.0.1
    fake-indexeddb: ^6.0.1
    publint: ^0.3.24
    # Must match the exact version bundled by vite-plus.
    vitest: 5.0.1
    vite: npm:@voidzero-dev/vite-plus-core@^1.0.0
    vite-plus: ^1.0.0
overrides:
    vite: 'catalog:'
    # VitePress 1 (root docs) doesn't support Rolldown, so it keeps its own Vite 5.
    'vitepress@1>vite': ^5.4.14
peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: '*'
minimumReleaseAgeExclude:
    - '@noeldemartin/*'
