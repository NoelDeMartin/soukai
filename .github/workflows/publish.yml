name: Publish packages

on:
    workflow_dispatch:
        inputs:
            packages:
                description: 'Space-separated list of packages to publish'
                required: true
                type: string
            latest:
                description: 'Publish packages as latest on npm'
                required: false
                type: boolean
                default: false

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  node-version-file: '.node-version'
                  cache: true
            - run: vp run -r build
            - name: Publish packages
              run: |
                  if [ "${{ github.event.inputs.packages }}" = "*" ]; then
                    packages=$(ls packages)
                  else
                    packages="${{ github.event.inputs.packages }}"
                  fi

                  for package in $packages; do
                    echo "Publishing $package..."
                    cd "packages/$package"
                    if [ "${{ github.event.inputs.latest }}" = "true" ]; then
                      vp exec noeldemartin-publish-package --latest
                    else
                      vp exec noeldemartin-publish-package
                    fi
                    cd ../..
                  done
